<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Campus-Connect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Campus<span>-</span>Connect</h1>
      <p class="sub">Log in to see and manage college events.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <button class="full" type="submit">Log in</button>
      </form>
      <div id="msg" class="msg"></div>
      <p>New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
