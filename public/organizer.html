<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizer · Campus-Connect</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="topbar">
    <div class="logo">Campus<span>-</span>Connect</div>
    <div class="who"><span id="who"></span><button class="ghost" onclick="Auth.logout()">Log out</button></div>
  </header>
  <main class="container">
    <section class="panel">
      <h2>Create an event</h2>
      <form id="eventForm">
        <label for="title">Title</label><input id="title" required>
        <label for="description">Description</label><textarea id="description"></textarea>
        <label for="venue">Venue</label><input id="venue">
        <label for="event_date">Date and time</label><input type="datetime-local" id="event_date" required>
        <label for="image">Poster image (optional, max 2 MB)</label>
        <input type="file" id="image" accept="image/png, image/jpeg, image/webp">
        <button class="full" type="submit">Send to admin for approval</button>
      </form>
      <div id="msg" class="msg"></div>
    </section>
    <h2>My events</h2>
    <div id="events" class="grid"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/organizer.js"></script>
</body>

</html>
